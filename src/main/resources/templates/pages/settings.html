<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="section">
        <h1 class="section__title section__title--muted">Settings Page</h1>

        <div class="section__actions">
            <button class="btn btn--ghost add-game-btn">
                Add Game
            </button>
        </div>

        <div class="table-wrap">
            <table class="app-table">
                <thead>
                    <tr>
                        <th>Game ID</th>
                        <th>Title</th>
                        <th>Release Year</th>
                        <th>Platform</th>
                        <th>etc</th>
                        <th>etc</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Counter Strike 2</td>
                        <td>2022</td>
                        <td>PC</td>
                        <td>-</td>
                        <td>-</td>
                        <td class="table-actions">
                            <button class="btn btn--ghost btn--small">Edit</button>
                            <button class="btn-delete openDeleteModal">
                                ✕
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

    <!-- ADD GAME MODAL -->
    <div class="modal-overlay" id="addGameModal">

        <div class="modal">

            <div class="modal__header">
                <h2>Add New Game</h2>
                <button class="modal__close" id="closeAddGame">✕</button>
            </div>

            <form class="modal__form" th:action="@{/games}" method="post">

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" required>
                </div>

                <div class="form-group">
                    <label>Genres</label>

                    <div class="genre-dropdown">
                        <button type="button" class="genre-dropdown__toggle" id="genreDropdownToggle">
                            Select genres
                        </button>

                        <div class="genre-dropdown__menu" id="genreDropdownMenu">

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Action">
                                <span>Action</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Adventure">
                                <span>Adventure</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="FPS">
                                <span>FPS</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="RPG">
                                <span>RPG</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Strategy">
                                <span>Strategy</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Racing">
                                <span>Racing</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Simulation">
                                <span>Simulation</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Sports">
                                <span>Sports</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Horror">
                                <span>Horror</span>
                            </label>

                            <label class="genre-option">
                                <input type="checkbox" name="genres" value="Indie">
                                <span>Indie</span>
                            </label>

                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Platform</label>
                    <input type="text" name="platform">
                </div>

                <div class="form-group">
                    <label>Developer</label>
                    <input type="text" name="developer">
                </div>

                <div class="form-group">
                    <label>Release Date</label>
                    <input type="date" name="releaseDate">
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="number" step="0.01" name="price">
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" name="imageUrl">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description"></textarea>
                </div>

                <div class="form-group form-checkbox">
                    <label>
                        <input type="checkbox" name="featured">
                        Featured Game
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Game
                </button>

            </form>

        </div>

    </div>

    <!-- DELETE POPUP -->
    <div class="modal-overlay" id="deleteModal">

        <div class="modal modal--small">

            <h3>Delete Game</h3>

            <p id="deleteText">
                Are you sure you want to delete this game?
            </p>

            <div class="modal-actions">

                <button class="btn btn--danger">
                    Delete
                </button>

                <button class="btn btn--ghost" id="cancelDelete">
                    Cancel
                </button>

            </div>

        </div>

    </div>
</div>
