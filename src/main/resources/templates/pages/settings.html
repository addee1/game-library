<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">
    <section class="section">
        <h1 class="section__title section__title--muted">Settings Page</h1>

        <div class="section__actions">
            <button class="btn btn--ghost add-game-btn">
                Add Game
            </button>
        </div>

        <div class="table-wrap">
            <table class="app-table">
                <thead>
                    <tr>
                        <th>Game ID</th>
                        <th>Title</th>
                        <th>Release Year</th>
                        <th>Platform</th>
                        <th>etc</th>
                        <th>etc</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>

                <tr th:each="game : ${games}">

                    <td th:text="${game.id}"></td>

                    <td th:text="${game.title}"></td>

                    <td th:text="${game.releaseDate != null ? #temporals.format(game.releaseDate, 'yyyy') : '-'}"></td>

                    <td th:text="${game.platform}"></td>

                    <td th:text="${game.developer}"></td>

                    <td th:text="${game.price != null ? '$' + game.price : 'Free'}"></td>

                    <td class="table-actions">

                        <button
                                class="btn btn--ghost btn--small openEditModal"
                                th:attr="
                                    data-id=${game.id},
                                    data-title=${game.title},
                                    data-platform=${game.platform},
                                    data-genres=${#strings.arrayJoin(game.genres, ',')},
                                    data-developer=${game.developer},
                                    data-releasedate=${game.releaseDate != null ? #temporals.format(game.releaseDate, 'yyyy-MM-dd') : ''},
                                    data-price=${game.price},
                                    data-image=${game.imageUrl},
                                    data-featured=${game.featured},
                                    data-description=${game.description}">
                            Edit
                        </button>

                        <form th:action="@{/games/{id}/delete(id=${game.id})}" method="post" style="display:inline">
                            <button type="button"
                                    class="btn-delete openDeleteModal"
                                    th:data-id="${game.id}"
                                    th:data-title="${game.title}">
                                ✕
                            </button>
                        </form>

                    </td>

                </tr>

                </tbody>
            </table>
        </div>

    </section>

    <!-- ADD GAME MODAL -->
    <div class="modal-overlay"
         id="addGameModal"
         th:classappend="${openAddModal} ? ' active'">

        <div class="modal">

            <div class="modal__header">
                <h2>Add New Game</h2>
                <button class="modal__close" id="closeAddGame">✕</button>
            </div>

            <form id="gameForm"
                  class="modal__form"
                  th:action="@{/games}"
                  th:object="${createGameDTO}"
                  method="post">

                <!-- TITLE -->
                <div class="form-group">
                    <label>Title</label>

                    <input type="text" th:field="*{title}">

                    <p class="form-error"
                       th:if="${#fields.hasErrors('title')}"
                       th:errors="*{title}">
                    </p>
                </div>


                <!-- GENRES -->
                <div class="form-group">
                    <label>Genres</label>

                    <div class="genre-dropdown">
                        <button type="button"
                                class="genre-dropdown__toggle"
                                id="genreDropdownToggle">
                            Select genres
                        </button>

                        <div class="genre-dropdown__menu" id="genreDropdownMenu">

                            <label class="genre-option" th:each="genre : ${genres}">
                                <input type="checkbox" th:field="*{genres}" th:value="${genre}">
                                <span th:text="${genre}"></span>
                            </label>

                        </div>
                    </div>

                    <p class="form-error"
                       th:if="${#fields.hasErrors('genres')}"
                       th:errors="*{genres}">
                    </p>

                </div>


                <!-- PLATFORM -->
                <div class="form-group">
                    <label>Platform</label>

                    <input type="text" th:field="*{platform}">

                    <p class="form-error"
                       th:if="${#fields.hasErrors('platform')}"
                       th:errors="*{platform}">
                    </p>
                </div>


                <!-- DEVELOPER -->
                <div class="form-group">
                    <label>Developer</label>

                    <input type="text" th:field="*{developer}">

                    <p class="form-error"
                       th:if="${#fields.hasErrors('developer')}"
                       th:errors="*{developer}">
                    </p>
                </div>


                <!-- RELEASE DATE -->
                <div class="form-group">
                    <label>Release Date</label>

                    <input type="date" th:field="*{releaseDate}">

                    <p class="form-error"
                       th:if="${#fields.hasErrors('releaseDate')}"
                       th:errors="*{releaseDate}">
                    </p>
                </div>


                <!-- PRICE -->
                <div class="form-group">
                    <label>Price</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{price}">

                    <p class="form-error"
                       th:if="${#fields.hasErrors('price')}"
                       th:errors="*{price}">
                    </p>
                </div>


                <!-- IMAGE -->
                <div class="form-group">
                    <label>Image URL</label>

                    <input type="text" th:field="*{imageUrl}">

                    <p class="form-error"
                       th:if="${#fields.hasErrors('imageUrl')}"
                       th:errors="*{imageUrl}">
                    </p>
                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">
                    <label>Description</label>

                    <textarea th:field="*{description}"></textarea>

                    <p class="form-error"
                       th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}">
                    </p>
                </div>


                <!-- FEATURED -->
                <div class="form-group form-checkbox">
                    <label>
                        <input type="checkbox" th:field="*{featured}">
                        Featured Game
                    </label>
                </div>


                <button type="submit" class="btn btn-primary">
                    Save Game
                </button>

            </form>

        </div>

    </div>

    <!-- DELETE POPUP -->
    <div class="modal-overlay" id="deleteModal">

        <div class="modal modal--small">

            <h3>Delete Game</h3>

            <p id="deleteText"></p>

            <form id="deleteForm" method="post">

                <div class="modal-actions">

                    <button type="submit" class="btn btn--danger">
                        Delete
                    </button>

                    <button type="button" class="btn btn--ghost" id="cancelDelete">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>
</div>
