<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <section class="games-page">

        <!-- TOOLBAR -->
        <form method="get" action="/games" class="games-toolbar">

            <div style="display:flex; gap:10px; align-items:center;">

                <input
                        type="text"
                        name="search"
                        class="games-search"
                        placeholder="Search games..."
                        th:value="${search}"
                >

                <button type="submit" class="btn btn--primary">
                    Search
                </button>

            </div>

            <div class="games-filters">

                <!-- FEATURED -->
                <div style="display:flex; align-items:center; gap:8px;">

                    <span style="font-size:14px; color:var(--color-text-secondary);">
                        Featured
                    </span>

                    <label class="switch">
                        <input type="checkbox"
                               name="featured"
                               value="true"
                               th:checked="${featured != null and featured}">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- PLATFORM -->
                <select name="platform" class="filter-btn">
                    <option value="">Platform</option>
                    <option th:each="p : ${platforms}"
                            th:value="${p}"
                            th:text="${p}"
                            th:selected="${p == platform}">
                    </option>
                </select>

                <!-- GENRE -->
                <select name="genre" class="filter-btn">
                    <option value="">Genre</option>
                    <option th:each="g : ${genres}"
                            th:value="${g}"
                            th:text="${g}"
                            th:selected="${g == genre}">
                    </option>
                </select>

                <!-- PRICE -->
                <select name="priceSort" class="filter-btn">
                    <option value="">Price</option>
                    <option value="low" th:selected="${priceSort == 'low'}">Low → High</option>
                    <option value="high" th:selected="${priceSort == 'high'}">High → Low</option>
                </select>


                <!-- SUBMIT -->
                <a href="/games" class="btn btn--ghost">
                    Reset Filters
                </a>

            </div>

        </form>


        <!-- GAME GRID -->
        <div class="games-grid">

            <div class="game-card"
                 th:each="game : ${games}"
                 th:onclick="|window.location.href='/games/${game.id}'|">

                <img th:src="${game.imageUrl}" alt="Game cover">

                <div class="game-info">

                    <h4 th:text="${game.title}"></h4>

                    <span th:text="${game.price != null ? '$' + game.price : 'Free'}"></span>

                </div>

            </div>

        </div>


        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(games)}" class="info-box">
            No games found.
        </div>


        <!-- PAGINATION -->
        <div class="pagination">

            <!-- PREVIOUS -->
            <a th:if="${currentPage > 0}"
               th:href="@{/games(
                   page=${currentPage - 1},
                   search=${search},
                   genre=${genre},
                   platform=${platform},
                   priceSort=${priceSort},
                   featured=${featured}
               )}"
               class="page-btn">‹</a>

            <!-- PAGE NUMBERS -->
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/games(
                   page=${i},
                   search=${search},
                   genre=${genre},
                   platform=${platform},
                   priceSort=${priceSort},
                   featured=${featured}
               )}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active'"
               class="page-btn">
            </a>

            <!-- NEXT -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/games(
                   page=${currentPage + 1},
                   search=${search},
                   genre=${genre},
                   platform=${platform},
                   priceSort=${priceSort},
                   featured=${featured}
               )}"
               class="page-btn">›</a>

        </div>

    </section>

</div>
