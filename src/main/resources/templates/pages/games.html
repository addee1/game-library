<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <section class="games-page">

        <!-- TOOLBAR -->
        <div class="games-toolbar">

            <input
                    type="text"
                    class="games-search"
                    placeholder="Search games..."
            >

            <div class="games-filters">

                <button class="filter-btn">
                    Platform ▾
                </button>

                <button class="filter-btn">
                    Genre ▾
                </button>

                <button class="filter-btn">
                    Price ▾
                </button>

            </div>

        </div>


        <!-- GAME GRID -->
        <div class="games-grid">

            <div class="game-card"
                 th:each="game : ${games}"
                 th:onclick="|window.location.href='/games/${game.id}'|">

                <img th:src="${game.imageUrl}" alt="Game cover">

                <div class="game-info">

                    <h4 th:text="${game.title}"></h4>

                    <span th:text="${game.price != null ? '$' + game.price : 'Free'}"></span>

                </div>

            </div>

        </div>


        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(games)}" class="info-box">
            No games found.
        </div>


        <!-- PAGINATION (UI only for now) -->
        <div class="pagination">

            <button class="page-btn">‹</button>

            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>

            <button class="page-btn">›</button>

        </div>

    </section>

</div>
