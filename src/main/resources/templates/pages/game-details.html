<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <section class="game-details">

        <!-- HERO -->
        <div class="game-hero">

            <!-- COVER -->
            <div class="game-cover">
                <img th:src="${game.imageUrl}" alt="Game cover">
            </div>

            <!-- META -->
            <div class="game-meta">

                <div class="game-header">

                    <h1 class="game-title"
                        th:text="${game.title}">
                    </h1>

                    <button class="favorite-btn">
                        ♥
                    </button>

                </div>

                <div class="game-info">

                    <p>
                        <strong>Developer:</strong>
                        <span th:text="${game.developer}"></span>
                    </p>

                    <p>
                        <strong>Release Date:</strong>
                        <span th:text="${#temporals.format(game.releaseDate,'yyyy')}"></span>
                    </p>

                    <p>
                        <strong>Platform:</strong>
                        <span th:text="${game.platform}"></span>
                    </p>


                    <!-- GENRES -->
                    <p>
                        <strong>Genres:</strong>

                        <span class="genre-tag"
                              th:each="genre : ${game.genres}"
                              th:text="${genre}">
                    </span>

                    </p>


                    <!-- PRICE -->
                    <p class="game-price"
                       th:text="${game.price != null ? '$' + game.price : 'Free'}">
                    </p>

                </div>


                <!-- DESCRIPTION -->
                <p class="game-description"
                   th:text="${game.description}">
                </p>

            </div>

        </div>

    </section>



    <section class="reviews-section">

        <div class="reviews-header">

            <h2>User Reviews</h2>

            <div class="rating-average">
                ★★★★★ 4.2 / 5
            </div>

        </div>


        <!-- ADD REVIEW BUTTON -->

        <div class="add-review-toggle">

            <p class="add-review-text">
                Want to add a review?
            </p>

            <button class="btn btn--ghost" id="toggleReviewForm">
                Add Review
            </button>

        </div>


        <!-- REVIEW FORM -->

        <div class="review-form-container" id="reviewForm">

            <div class="review-rating-select">

                <input type="text" placeholder="Your name">

                <div class="star-rating" id="starRating">

                    <span data-value="1">☆</span>
                    <span data-value="2">☆</span>
                    <span data-value="3">☆</span>
                    <span data-value="4">☆</span>
                    <span data-value="5">☆</span>

                </div>

            </div>

            <textarea placeholder="Comment (optional)"></textarea>

            <button class="btn btn--primary">
                Submit Review
            </button>

        </div>


        <!-- REVIEW LIST (still placeholder for now) -->

        <div class="reviews-list">

            <div class="review-card">

                <div class="review-rating">★★★★★</div>

                <p class="review-text">
                    "Amazing world and storytelling!"
                </p>

                <div class="review-meta">
                    <span>PlayerOne</span>
                    <span>12 Mar 2026</span>
                </div>

            </div>

            <div class="review-card">

                <div class="review-rating">★★★★☆</div>

                <p class="review-text">
                    "Great game but still some bugs."
                </p>

                <div class="review-meta">
                    <span>GamerGuy</span>
                    <span>10 Mar 2026</span>
                </div>

            </div>

        </div>

    </section>

</div>
</html>
