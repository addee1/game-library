<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <section class="game-details">

        <!-- HERO -->
        <div class="game-hero">

            <!-- COVER -->
            <div class="game-cover">
                <img th:src="${game.imageUrl}" alt="Game cover">
            </div>

            <!-- META -->
            <div class="game-meta">

                <div class="game-header">

                    <h1 class="game-title"
                        th:text="${game.title}">
                    </h1>

                    <button class="favorite-btn">
                        ♥
                    </button>

                </div>

                <div class="game-info">

                    <p>
                        <strong>Developer:</strong>
                        <span th:text="${game.developer}"></span>
                    </p>

                    <p>
                        <strong>Release Date:</strong>
                        <span th:text="${#temporals.format(game.releaseDate,'yyyy')}"></span>
                    </p>

                    <p>
                        <strong>Platform:</strong>
                        <span th:text="${game.platform}"></span>
                    </p>

                    <!-- GENRES -->
                    <p>
                        <strong>Genres:</strong>

                        <span class="genre-tag"
                              th:each="genre : ${game.genres}"
                              th:text="${genre}">
                        </span>

                    </p>

                    <!-- PRICE -->
                    <p class="game-price"
                       th:text="${game.price != null ? '$' + game.price : 'Free'}">
                    </p>

                </div>

                <!-- DESCRIPTION -->
                <p class="game-description"
                   th:text="${game.description}">
                </p>

            </div>

        </div>

    </section>


    <section class="reviews-section">

        <div class="reviews-header">

            <h2>User Reviews</h2>

            <div class="rating-average"
                 th:if="${averageRating > 0}">

                <span th:text="${#numbers.formatDecimal(averageRating,1,1)}"></span> / 5
            </div>
        </div>


        <!-- ADD REVIEW BUTTON -->
        <div class="add-review-toggle">

            <p class="add-review-text">
                Want to add a review?
            </p>

            <button class="btn btn--ghost" id="toggleReviewForm">
                Add Review
            </button>

        </div>
        <div class="form-success"
             th:if="${param.success}">
            Review submitted successfully!
        </div>

        <!-- REVIEW FORM -->
        <form class="review-form-container"
              id="reviewForm"
              th:action="@{/games/{id}/reviews(id=${game.id})}"
              method="post"
              th:object="${createReviewDTO}"
              th:classappend="${#fields.hasErrors()} ? 'active'">


            <div class="review-rating-select">

                <!-- USERNAME -->
                <input type="text"
                       placeholder="Your name"
                       th:field="*{username}">



                <!-- STARS -->
                <div class="star-rating" id="starRating">
                    <span data-value="1">☆</span>
                    <span data-value="2">☆</span>
                    <span data-value="3">☆</span>
                    <span data-value="4">☆</span>
                    <span data-value="5">☆</span>
                </div>

            </div>

            <!-- HIDDEN RATING -->
            <input type="hidden" th:field="*{rating}" id="ratingInput">


            <!-- COMMENT (OPTIONAL) -->
            <textarea placeholder="Comment (optional)"
                      th:field="*{comment}"></textarea>

            <!-- SUBMIT -->
            <button type="submit" class="btn btn--primary">
                Submit Review
            </button>

            <div class="form-error"
                 th:if="${#fields.hasErrors()}">
                Please fill in username and rating.

            </div>

        </form>


        <!-- REVIEW LIST -->
        <div class="reviews-list">

            <div class="review-card"
                 th:each="review : ${reviews}">

                <div class="review-rating"
                     th:text="${#strings.repeat('★', review.rating)} + ${#strings.repeat('☆', 5 - review.rating)}">
                </div>

                <p class="review-text"
                   th:text="${review.comment}">
                </p>

                <div class="review-meta">
                    <span th:text="${review.username}"></span>
                    <span th:text="${#temporals.format(review.createdAt,'dd MMM yyyy')}"></span>
                </div>

            </div>

        </div>

    </section>

</div>
</html>
