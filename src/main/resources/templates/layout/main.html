<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - GAMERZ' : 'GAMERZ'}">GAMERZ</title>
    <link rel="stylesheet" th:href="@{/css/themes/dark.css}">
    <link rel="stylesheet" th:href="@{/css/themes/light.css}">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/header :: header}"></header>

        <main class="page-container">
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>
</div>
<script src="/js/theme.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/reviews.js"></script>
</body>
</html>
